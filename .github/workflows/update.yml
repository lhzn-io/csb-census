name: Census update

on:
  # The Cloudflare Worker in poller/ starts an incremental run within minutes of each NCEI batch
  # (workflow_dispatch). The schedule is the fallback: incremental at :55 after each batch hour, and
  # the daily reconcile against the full bucket listing.
  schedule:
    - cron: "55 0,6,12,18 * * *"
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [incremental, reconcile]
        default: incremental

permissions:
  contents: write # read and write the `state` release assets
  actions: write # re-enable this workflow so the 60-day inactivity rule never pauses the schedule

concurrency:
  group: csb-census-state
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  SHOW_PROVIDERS: ${{ vars.SHOW_PROVIDERS || 'false' }}

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions
          key: duckdb-ext-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen

      - name: Update the census state
        run: |
          mode="${{ github.event.inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "${{ github.event.schedule }}" = "15 3 * * *" ]; then mode=reconcile; else mode=incremental; fi
          fi
          echo "mode: $mode"
          uv run csb-census "$mode" --state state --repo "$REPO" --threads 4 --memory-limit 10GB

      - name: Build published data
        run: |
          args=()
          if [ "$SHOW_PROVIDERS" = "true" ]; then args+=(--providers); fi
          if [ -f data/regions/lis.geojson ]; then args+=(--lis-polygon data/regions/lis.geojson); fi
          uv run csb-census layers --state state --out site/public/data "${args[@]}" --threads 4 --memory-limit 10GB

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the site
        working-directory: site
        env:
          VITE_SHOW_PROVIDERS: ${{ env.SHOW_PROVIDERS }}
        run: npm ci && npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site/dist
          retention-days: 1

      - name: Keep the schedule alive
        if: github.event.schedule == '15 3 * * *'
        run: gh api -X PUT "repos/$REPO/actions/workflows/update.yml/enable"

  # A separate job so the Cloudflare token never shares a runner with the npm and Python dependencies
  # above. Its secrets live in the `cloudflare` environment, which only the main branch may use.
  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare
      url: https://csb.longhorizon.eco
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist
      # Cloudflare Pages project csb-census (csb.longhorizon.eco). The token needs Pages edit only.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          gen=$(jq -r .generation dist/data/meta.json)
          npx --yes wrangler@4.140.0 pages deploy dist --project-name csb-census --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "census generation $gen"
