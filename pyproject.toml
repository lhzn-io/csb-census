[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csb-census"
version = "0.1.0"
description = "An open, reproducible census of crowdsourced bathymetry published by the IHO DCDB: unique soundings, duplicates and coverage per provider."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Daniel Fry", email = "dfry@lhzn.io" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "duckdb>=1.1",
  "click>=8.1",
  "pyproj>=3.7",  # PROJ 9.6+ provides the spilhaus projection
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff",
  "pre-commit",
]

[project.scripts]
csb-census = "csb_census.cli:cli"

[project.urls]
Issues = "https://github.com/lhzn-io/csb-census/issues"
Source = "https://github.com/lhzn-io/csb-census"

[tool.hatch.build.targets.wheel]
packages = ["src/csb_census"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
